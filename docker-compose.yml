# =============================================================================
# DEPLOY DI VPS: PostgreSQL + backend + frontend + Caddy (HTTPS) dalam satu perintah
# =============================================================================
# Persiapan (sekali):  cp docker.env.example .env   lalu isi nilainya
# Menyalakan:          docker compose up -d --build
# Melihat log:         docker compose logs -f backend
# Panduan lengkap: README bagian "Deploy ke VPS dengan Docker".
#
# Hanya Caddy yang membuka port ke luar. PostgreSQL, backend, dan frontend hanya bisa dihubungi
# sesama container. Data tersimpan di volume bernama sehingga aman saat container dibuat ulang.
# =============================================================================

name: kominfo-kegiatan

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: kominfo_pd_kg
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      TZ: UTC
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kominfo_pd_kg"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  backend:
    build:
      context: ./apps/api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3001
      # Kata sandi DB dipakai di dalam URL, jadi sebaiknya hanya huruf dan angka
      DATABASE_URL: postgres://postgres:${DB_PASSWORD}@postgres:5432/kominfo_pd_kg
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${APP_URL}
      FRONTEND_URL: ${APP_URL}
      STORAGE_DIR: /data/storage
      # Bila diisi, foto dan dokumen disimpan di Cloudinary (volume storage di bawah tidak terpakai)
      CLOUDINARY_URL: ${CLOUDINARY_URL}
      CLOUDINARY_FOLDER: ${CLOUDINARY_FOLDER}

      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_SECURE: ${SMTP_SECURE}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM: ${SMTP_FROM}
      BREVO_API_KEY: ${BREVO_API_KEY}
      TZ: Asia/Jakarta
    volumes:
      # Foto dan dokumen kegiatan bila CLOUDINARY_URL kosong 
      - storage:/data/storage

  frontend:
    build:
      context: ./apps/web
      args:
        # Next.js meneruskan /api/* ke backend lewat jaringan internal compose
        API_URL: http://backend:3001
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - frontend
    ports:
      - "${HTTP_PORT}:80"
      - "${HTTPS_PORT}:443"
      - "${HTTPS_PORT}:443/udp"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Sertifikat HTTPS disimpan agar tidak diminta ulang setiap restart
      - caddy-data:/data
      - caddy-config:/config

volumes:
  postgres-data:
  storage:
  caddy-data:
  caddy-config:
